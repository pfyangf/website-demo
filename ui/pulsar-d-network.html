ELOPMENT LIMITED</section><aside>静态设计预览 · 联系方式与法律文本待确认<br>内容不构成投资建议或任何证券、基金权益的要约。<br><a href="compare.html">比较四版设计</a></aside></footer><script>const cities=[["香港", "连接资本与国际市场", "以香港为中心，关注跨境投资与产业合作，连接中国内地与日本。"], ["北京", "关注研究与产业趋势", "以研究拓宽视野，理解市场变化与产业发展的长期趋势。"], ["深圳", "连接创新与制造生态", "关注技术创新与产业协同，探索资源连接与企业价值创造。"], ["东京", "拓展中日合作可能", "连接日本市场与产业网络，探索跨境协同的新机会。"]];const tabs=[...document.querySelectorAll('[data-city]')];function select(i){tabs.forEach((t,n)=>{t.setAttribute('aria-selected',n===i);t.tabIndex=n===i?0:-1});document.getElementById('city-name').textContent=cities[i][0];document.getElementById('city-copy').textContent=cities[i][2];document.getElementById('city-detail').setAttribute('aria-labelledby','city-'+i)}tabs.forEach((t,i)=>{t.onclick=()=>select(i);t.onkeydown=e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?3:(i+(['ArrowDown','ArrowRight'].includes(e.key)?1:3))%4;select(n);tabs[n].focus()}}});</script><script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pending');observer.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.statement,.focus-card,.city-description,.contact').forEach(el=>{el.classList.add('reveal','pending');observer.observe(el)})}</script></body></html>
